<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mohan Traders - Shop & Inventory Management</title>
  
  <!-- Meta tags for PWA & mobile usability -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Wholesale Beverage & FMCG Distribution, Daily Route POS, Inventory Load & Google Sheets Database">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              600: '#0284c7',
              700: '#0369a1',
              900: '#0c4a6e',
            }
          }
        }
      }
    }
  </script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-slate-100/70 text-slate-900 flex flex-col antialiased pb-20 md:pb-6">

  <!-- TOP APP HEADER -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      
      <!-- Brand & Shop Info -->
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-white font-extrabold shadow-sm">
          <i data-lucide="store" class="w-5 h-5 text-blue-400"></i>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="font-extrabold text-slate-900 text-base sm:text-lg tracking-tight">MOHAN TRADERS</span>
            <span class="hidden sm:inline-flex px-2 py-0.5 text-[10px] font-bold rounded-full bg-blue-50 text-blue-700 border border-blue-200">
              Wholesale FMCG
            </span>
          </div>
          <p class="text-[11px] text-slate-500 font-medium">Tollgate • Samayapuram • Manachanallur</p>
        </div>
      </div>

      <!-- Center Desktop Navigation Tabs -->
      <nav class="hidden md:flex items-center gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200/80" aria-label="Main Navigation">
        <button onclick="switchTab('overview')" data-nav-tab="overview" class="flex items-center gap-2 px-3 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-sm">
          <i data-lucide="layout-dashboard" class="w-4 h-4"></i>
          <span>Dashboard</span>
        </button>
        <button onclick="switchTab('pos')" data-nav-tab="pos" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
          <i data-lucide="shopping-cart" class="w-4 h-4"></i>
          <span>Route POS</span>
        </button>
        <button onclick="switchTab('daily-load')" data-nav-tab="daily-load" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
          <i data-lucide="truck" class="w-4 h-4"></i>
          <span>Daily Load</span>
        </button>
        <button onclick="switchTab('products')" data-nav-tab="products" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
          <i data-lucide="package" class="w-4 h-4"></i>
          <span>Products</span>
        </button>
        <button onclick="switchTab('shops')" data-nav-tab="shops" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
          <i data-lucide="store" class="w-4 h-4"></i>
          <span>Shops (212)</span>
        </button>
        <button onclick="switchTab('suppliers')" data-nav-tab="suppliers" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
          <i data-lucide="building" class="w-4 h-4"></i>
          <span>Suppliers</span>
        </button>
        <button onclick="switchTab('settings')" data-nav-tab="settings" class="flex items-center gap-2 px-3 py-2 text-sm font-medium rounded-lg text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition">
          <i data-lucide="sheet" class="w-4 h-4"></i>
          <span>Google Sheet</span>
        </button>
      </nav>

      <!-- Right Header Actions (Sync Status, Refresh & Quick Bill Button) -->
      <div class="flex items-center gap-2">
        <div class="flex items-center gap-1 bg-slate-50 border border-slate-200/80 rounded-full px-1.5 py-0.5">
          <div id="live-sync-pill" class="cursor-pointer" onclick="switchTab('settings')" title="Click to view Google Sheet sync settings">
            <span class="inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-semibold bg-amber-50 text-amber-700 border border-amber-200">
              <span class="w-2 h-2 rounded-full bg-amber-500"></span>
              <span class="hidden sm:inline">Offline (Local)</span>
            </span>
          </div>
          <button onclick="manualRefresh()" title="Refresh live data from Google Sheet" class="p-1 text-slate-500 hover:text-blue-600 hover:bg-slate-200/60 rounded-full transition active:scale-90">
            <i data-lucide="refresh-cw" id="manual-refresh-icon" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <button onclick="openQuickSale()" class="inline-flex items-center gap-1.5 px-3 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl text-xs sm:text-sm shadow-sm transition active:scale-95">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
          <span class="hidden sm:inline">New Bill</span>
        </button>
      </div>

    </div>
  </header>

  <!-- MAIN APP CONTAINER -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
    <div id="main-content">
      <!-- Dynamically rendered by app.js -->
    </div>
  </main>

  <!-- MOBILE BOTTOM NAVIGATION BAR -->
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-white border-t border-slate-200 z-40 px-2 py-1 flex items-center justify-around shadow-lg" aria-label="Mobile Navigation">
    <button onclick="switchTab('overview')" data-mobile-tab="overview" class="flex flex-col items-center justify-center text-blue-600 font-semibold text-xs py-1">
      <i data-lucide="layout-dashboard" class="w-5 h-5 mb-0.5"></i>
      <span>Overview</span>
    </button>
    <button onclick="switchTab('pos')" data-mobile-tab="pos" class="flex flex-col items-center justify-center text-slate-500 text-xs py-1 hover:text-slate-900">
      <i data-lucide="shopping-cart" class="w-5 h-5 mb-0.5"></i>
      <span>POS</span>
    </button>
    <button onclick="switchTab('daily-load')" data-mobile-tab="daily-load" class="flex flex-col items-center justify-center text-slate-500 text-xs py-1 hover:text-slate-900">
      <i data-lucide="truck" class="w-5 h-5 mb-0.5"></i>
      <span>Van Load</span>
    </button>
    <button onclick="switchTab('products')" data-mobile-tab="products" class="flex flex-col items-center justify-center text-slate-500 text-xs py-1 hover:text-slate-900">
      <i data-lucide="package" class="w-5 h-5 mb-0.5"></i>
      <span>Products</span>
    </button>
    <button onclick="switchTab('shops')" data-mobile-tab="shops" class="flex flex-col items-center justify-center text-slate-500 text-xs py-1 hover:text-slate-900">
      <i data-lucide="store" class="w-5 h-5 mb-0.5"></i>
      <span>Shops</span>
    </button>
    <button onclick="switchTab('settings')" data-mobile-tab="settings" class="flex flex-col items-center justify-center text-slate-500 text-xs py-1 hover:text-slate-900">
      <i data-lucide="sheet" class="w-5 h-5 mb-0.5"></i>
      <span>Sheet</span>
    </button>
  </nav>

  <!-- MODAL CONTAINER (FOR POPUPS, DIALOGS & BILL PRINTING) -->
  <div id="modal-container"></div>

  <!-- EMBEDDED SEED DATA & APPLICATION LOGIC -->
  <script src="seedData.js"></script>
  <script src="app.js"></script>
</body>
</html>
